name: Refresh activity graph

on:
  schedule:
    - cron: "17 6 * * *" # daily, a little after midnight US Eastern
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch Deploy site; a GITHUB_TOKEN push does not trigger it

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rebuild the SVG
        run: python scripts/build_activity_svg.py
      - name: Commit if it changed
        id: commit
        run: |
          if git diff --quiet -- assets/img/activity.svg assets/img/simulations.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/img/activity.svg assets/img/simulations.svg
            git commit -m "Refresh activity graph"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy site" --ref main
